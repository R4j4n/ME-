<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireframe hero</title>
<style>
/* ==========================================================================
   WIREFRAME HERO — self-contained, no dependencies, no JS required.

   To drop into your own site, copy two things:
     1. everything inside the ".wf ..." rules below
     2. the <figure class="wf"> ... </figure> block in the body
   Everything else on this page is just demo chrome.

   Tune it with the custom properties on .wf:
     --wf-draw    how long the whole drawing takes
     --wf-delay   pause before the first stroke
     --wf-ink / --wf-ghost / --wf-pen   colours
     --wf-width   stroke weight in px (constant at any size)
   ========================================================================== */

.wf {
  --wf-draw: 14s;          /* total draw time, all 140 strokes */
  --wf-delay: .35s;        /* beat before the first stroke */
  --wf-ink: #dfdfdf;       /* the drawing */
  --wf-ghost: #2e2e2e;     /* faint full drawing underneath */
  --wf-pen: #ffffff;       /* travelling pen head */
  --wf-width: 1.6px;
  --wf-glow: 7px;          /* set to 0 to switch the glow off */

  /* Inverted, for a white page — override these on .wf and you are done:
       --wf-ink: #111; --wf-ghost: #d6d6d6; --wf-pen: #000; --wf-glow: 0; */

  display: block;
  margin: 0;
  line-height: 0;
}

.wf svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.wf path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: var(--wf-width);
  vector-effect: non-scaling-stroke;   /* weight stays put at any size */
}

/* faint full drawing, so the shape is hinted before it is drawn */
.wf .wf-ghost {
  opacity: 0;
  animation: wf-ghost-in 1.1s ease-out var(--wf-delay) forwards;
}
.wf .wf-ghost path { stroke: var(--wf-ghost); }

/* one filter on the group, not 140 on the paths -- same look, far less paint */
.wf .wf-ink {
  filter: drop-shadow(0 0 var(--wf-glow)
          color-mix(in srgb, var(--wf-ink) 45%, transparent));
}
.wf .wf-pen { filter: drop-shadow(0 0 5px var(--wf-pen)); }

/* the ink: each stroke is one dash as long as itself, unrolled to zero */
.wf .wf-ink path {
  stroke: var(--wf-ink);
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: wf-draw calc(var(--wf-draw) * var(--t)) linear
             calc(var(--wf-delay) + .6s + var(--wf-draw) * var(--d)) forwards;
}

/* a short bright dash riding the same path = the pen tip.
   animation-fill-mode is deliberately absent: outside its own window the
   element falls back to opacity 0 and disappears. */
.wf .wf-pen path {
  stroke: var(--wf-pen);
  stroke-width: calc(var(--wf-width) + 1.4px);
  stroke-dasharray: .02 .98;
  opacity: 0;
  animation: wf-pen calc(var(--wf-draw) * var(--t)) linear
             calc(var(--wf-delay) + .6s + var(--wf-draw) * var(--d));
}

@keyframes wf-draw   { to { stroke-dashoffset: 0; } }
@keyframes wf-ghost-in { to { opacity: .55; } }
@keyframes wf-pen {
  from { opacity: 1; stroke-dashoffset: .02; }
  to   { opacity: 1; stroke-dashoffset: -.98; }
}

/* replay when it scrolls back into view (needs the <script> at the bottom;
   delete both and the animation simply plays once on load) */
.wf.wf-idle .wf-ghost,
.wf.wf-idle .wf-ink path,
.wf.wf-idle .wf-pen path { animation: none; }

/* motion-sensitive visitors get the finished drawing, no drawing-on */
@media (prefers-reduced-motion: reduce) {
  .wf .wf-ghost { animation: none; opacity: .55; }
  .wf .wf-ink path { animation: none; stroke-dashoffset: 0; }
  .wf .wf-pen { display: none; }
}

/* ---------- demo page chrome (replace with your own) ---------------------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100svh;
  background: #000;
}
.hero {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 3rem 1.5rem;
}
/* the drawing is 0.7 wide for every 1 tall: bound it by height, then let
   max-width claw it back on narrow screens (the ratio is preserved either way) */
.hero .wf { max-width: 100%; }
.hero .wf svg {
  width: auto;
  height: min(82svh, 780px);
  max-width: 100%;
}
</style>
</head>

<script>
/* Optional: replay the drawing whenever the hero re-enters the viewport.
   Delete this whole <script> for a pure HTML/CSS, play-once hero. */
document.querySelectorAll('.wf').forEach(function (el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        el.classList.remove('wf-idle');
      } else {
        el.classList.add('wf-idle');
        void el.offsetWidth;               /* force a reflow so it restarts */
      }
    });
  }, { threshold: .25 }).observe(el);
});
</script>
